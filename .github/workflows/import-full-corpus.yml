name: Import full specifications corpus

on:
  pull_request:
    branches: [main]
    paths:
      - "migration/FULL_CORPUS.md"

permissions:
  contents: write

concurrency:
  group: import-full-specifications-corpus-macos
  cancel-in-progress: false

jobs:
  import:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Import, validate, and attach the source history
        env:
          SOURCE_REPOSITORY: hara-lang/hara-specs
          SOURCE_COMMIT: dc269add5de05d06ddf215ca9f1d2d2b0c49f135
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: bash scripts/import-full-corpus.sh
