name: Apply EDN native contract parity

on:
  push:
    branches:
      - agent/classify-edn-read-forms

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Update the closed native inventory
        shell: bash
        run: |
          cat > /tmp/apply.py <<'PY'
          from pathlib import Path

          path = Path("00-unsorted/platform-language/draft/conformance/native.edn")
          text = path.read_text()

          old_count = "  :method-count 161\n"
          new_count = "  :method-count 162\n"
          if text.count(old_count) != 1:
              raise SystemExit("expected one native method count")
          text = text.replace(old_count, new_count)

          old_edn = "\n".join([
              "  {:name Edn",
              "   :availability :implemented",
              "   :methods [read]",
              "   :method-classification {:hal-wrapper :all}",
              '   :wrapper-source "lib/src/std/foundation/edn.hal"}',
              "",
          ])
          new_edn = "\n".join([
              "  {:name Edn",
              "   :availability :implemented",
              "   :methods [read read-forms]",
              "   :method-classification",
              "   {:hal-wrapper [read]",
              "    :foundation-primitive [read-forms]}",
              '   :wrapper-source "lib/src/std/foundation/edn.hal"}',
              "",
          ])
          if text.count(old_edn) != 1:
              raise SystemExit("expected one Edn native type entry")
          path.write_text(text.replace(old_edn, new_edn))
          Path(".github/workflows/apply-edn-read-forms-contract.yml").unlink()
          PY
          python3 /tmp/apply.py

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Classify Edn read-forms in native contract"
          git push
