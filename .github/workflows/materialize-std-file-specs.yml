name: Materialize std.native.File specifications

on:
  push:
    branches:
      - agent/materialize-std-file-specs
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Create specification branch
        shell: bash
        run: |
          set -euo pipefail
          git checkout -B agent/std-native-file-contract

      - name: Update native and foundation contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement target, found {count}")
              file.write_text(text.replace(old, new, 1))

          native = "01-lang/003-native/draft/native-spec.edn"
          replace_once(
              native,
              '''  {:native/id :std.native/file
   :native/symbol File :native/namespace std.native.File
   :native/availability :capability-gated :native/capability :file
   :native/methods [resolve read write exists? list mkdir delete]}''',
              '''  {:native/id :std.native/file
   :native/symbol File :native/namespace std.native.File
   :native/availability :capability-gated :native/capability :file
   :native/methods
   [parent join resolve read write exists? stat entries list walk mkdir delete
    copy move temp-file temp-directory]}''')

          native_file_contract = r'''

 :native/file
 {:file/logical-paths
  {:path/root "/"
   :path/root-meaning :mounted-filesystem-root
   :path/separator "/"
   :path/relative-inputs true
   :path/returned-form :canonical-absolute
   :path/normalisation
   [:collapse-duplicate-separators :remove-dot-segments :resolve-parent-segments]
   :path/outside-root :file/outside-root
   :path/forbidden
   [:tilde-expansion :ambient-working-directory :windows-drive-prefixes
    :host-specific-separators]
   :path/host-mapping :provider-boundary-only}

  :file/effects
  {:effect/result :promise
   :effect/argument-and-type-errors :synchronous
   :effect/capability-and-filesystem-errors :promise-rejection
   :effect/valid-call-never-throws-host-error true}

  :file/operations
  {:pure-compatibility [parent join resolve]
   :metadata [stat entries]
   :read [read exists? list walk]
   :write [write mkdir delete copy move temp-file temp-directory]
   :deprecated [parent join resolve walk]
   :preferred-path-library std.fs.path
   :preferred-directory-enumeration entries}

  :file/options
  {:write {:mode #{:create :replace :append}
           :parents? false
           :default {:mode :create :parents? false}}
   :mkdir {:parents? true
           :exists-ok? true
           :default {:parents? true :exists-ok? true}}
   :delete {:missing-ok? false
            :default {:missing-ok? false}
            :scope #{:file :symlink :empty-directory}}
   :copy {:replace? false
          :parents? false
          :preserve-modified? false
          :scope :one-regular-file
          :follow-links false}
   :move {:replace? false
          :parents? false
          :atomic? false
          :scope :one-provider}
   :temp-file {:prefix "tmp" :suffix ""}
   :temp-directory {:prefix "tmp"}}

  :file/entry
  {:entry/shape
   {:path :canonical-logical-path
    :name :string
    :type #{:file :directory :symlink :other}
    :size #{:integer nil}
    :modified-at :unix-epoch-milliseconds
    :extensions :map}
   :entry/size-only-for :file
   :entry/sorted-by :path
   :entry/follow-symbolic-links false}

  :file/results
  {:read :bytes
   :exists? :boolean
   :stat :entry
   :entries :sorted-entry-vector
   :list :sorted-canonical-path-vector
   :write :canonical-path
   :mkdir :canonical-path
   :delete :canonical-path
   :copy :canonical-target-path
   :move :canonical-target-path
   :temp-file :canonical-path
   :temp-directory :canonical-path}

  :file/errors
  {:error/type ExceptionInfo
   :error/data
   {:error/code :file/code
    :file/operation :keyword
    :file/path :canonical-logical-path
    :file/target #{:canonical-logical-path nil}}
   :error/codes
   [:file/not-found :file/already-exists :file/invalid-path
    :file/outside-root :file/denied :file/not-directory :file/is-directory
    :file/directory-not-empty :file/permission-denied :file/unsupported
    :file/io]
   :error/exists-not-found false
   :error/exists-other-failures :reject
   :error/host-message-non-semantic true}}
'''
          replace_once(native, "\n :native/capabilities\n", native_file_contract + "\n :native/capabilities\n")

          legacy = "00-unsorted/platform-language/draft/conformance/native.edn"
          replace_once(legacy, ":method-count 239", ":method-count 244")
          replace_once(
              legacy,
              '''  {:name File
   :availability :capability-gated
   :methods [parent join resolve read write exists? stat list walk mkdir delete]
   :method-classification {:native-only :all}}''',
              '''  {:name File
   :availability :capability-gated
   :methods [parent join resolve read write exists? stat entries list walk mkdir delete
             copy move temp-file temp-directory]
   :method-classification {:native-only :all}
   :deprecated [parent join resolve walk]
   :preferred-path-library std.fs.path}''')

          legacy_file_contract = r'''

 :file
 {:status :accepted
  :logical-paths
  {:root "/"
   :separator "/"
   :relative-inputs true
   :returns :canonical-absolute
   :normalisation [:duplicate-separators :dot-segments :parent-segments]
   :escape-above-root :file/outside-root
   :host-paths :provider-private}
  :effects
  {:returns :promise
   :argument-errors :synchronous
   :capability-and-filesystem-errors :rejected-promise}
  :entry-shape
  {:path :string
   :name :string
   :type [:file :directory :symlink :other]
   :size [:integer nil]
   :modified-at :unix-epoch-milliseconds
   :extensions {}}
  :no-follow [:stat :entries :walk :copy]
  :sorted-results [:entries :list :walk]
  :write-default {:mode :create :parents? false}
  :mkdir-default {:parents? true :exists-ok? true}
  :delete-default {:missing-ok? false}
  :copy-default {:replace? false :parents? false :preserve-modified? false}
  :move-default {:replace? false :parents? false :atomic? false}
  :temp-file-default {:prefix "tmp" :suffix ""}
  :temp-directory-default {:prefix "tmp"}
  :stable-error-data
  [:error/code :file/operation :file/path :file/target]
  :stable-error-codes
  [:file/not-found :file/already-exists :file/invalid-path
   :file/outside-root :file/denied :file/not-directory :file/is-directory
   :file/directory-not-empty :file/permission-denied :file/unsupported :file/io]}
'''
          replace_once(legacy, "\n :types\n", legacy_file_contract + "\n :types\n")

          foundation = "01-lang/004-foundation/draft/foundation-spec.edn"
          replace_once(
              foundation,
              '''#{:bootstrap-referral :namespace-configuration :root-public-vars
    :root-macros :protocol-aliases :native-type-aliases
    :portable-function-wrappers :public-metadata}''',
              '''#{:bootstrap-referral :namespace-configuration :root-public-vars
    :root-macros :protocol-aliases :native-type-aliases
    :portable-function-wrappers :public-metadata :portable-library-contracts}''')

          filesystem_contract = r'''

 :foundation/portable-filesystem
 {:filesystem/status :draft
  :filesystem/not-root-referred true
  :filesystem/native-spec :hara/native
  :filesystem/native-type :std.native/file
  :filesystem/path-model :canonical-logical-path
  :filesystem/effect-model :promise
  :filesystem/namespaces
  [{:namespace std.fs.path
    :classification :portable-hal
    :functions
    [normalise join resolve parent root file-name segments relativize subpath
     suffix remove-suffix add-suffix replace-suffix]}
   {:namespace std.fs.walk
    :classification :portable-hal-over-native-entries
    :functions [walk]}
   {:namespace std.fs
    :classification :portable-hal-over-native-file
    :functions
    [stat exists? entries list read-bytes write-bytes file? directory? symlink?
     select create-directory mkdir temp-file temp-directory copy-single copy
     copy-into move delete]}]
  :filesystem/requirements
  [{:requirement/id :filesystem/path-purity
    :requirement/level :must
    :requirement/text
    "std.fs.path is synchronous portable HAL and exposes no host path semantics."}
   {:requirement/id :filesystem/effect-promises
    :requirement/level :must
    :requirement/text
    "Every std.fs operation that touches the mounted filesystem returns a promise."}
   {:requirement/id :filesystem/deterministic-traversal
    :requirement/level :must
    :requirement/text
    "Traversal is lexical, sorted, depth-controlled, and never follows symbolic links."}
   {:requirement/id :filesystem/portable-recursion
    :requirement/level :must
    :requirement/text
    "Recursive copy creates directories before children; recursive delete removes directories in post-order."}
   {:requirement/id :filesystem/fail-fast
    :requirement/level :must
    :requirement/text
    "Recursive failures reject immediately; completed mutations are neither rolled back nor returned as partial success."}
   {:requirement/id :filesystem/safe-existing-targets
    :requirement/level :must
    :requirement/text
    "Write, copy, and move fail when the target exists unless replacement is explicitly requested."}]
  :filesystem/results
  {:simple-mutations :canonical-logical-path
   :recursive-copy :source-to-target-map
   :recursive-delete :deleted-path-vector}
  :filesystem/source
  ["../../../../lib/src/std/fs.hal"
   "../../../../lib/src/std/fs/path.hal"
   "../../../../lib/src/std/fs/walk.hal"]}
'''
          replace_once(foundation, "\n :foundation/errors\n", filesystem_contract + "\n :foundation/errors\n")
          PY

      - name: Regenerate and validate registry
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          npm test
          npm run check

      - name: Commit clean specification branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            01-lang/003-native/draft/native-spec.edn \
            01-lang/004-foundation/draft/foundation-spec.edn \
            00-unsorted/platform-language/draft/conformance/native.edn \
            registry-index.json \
            spec-manifest.json
          git commit -m "Specify the logical filesystem boundary and portable std.fs"
          git push --force origin HEAD:refs/heads/agent/std-native-file-contract
