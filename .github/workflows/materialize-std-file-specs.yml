name: Materialize std.native.File specifications

on:
  push:
    branches:
      - agent/materialize-std-file-specs
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Create specification branch
        shell: bash
        run: |
          set -euo pipefail
          git checkout -B agent/std-native-file-contract

      - name: Update native and foundation contracts
        shell: bash
        run: |
          set -euo pipefail
          base64 -d "$GITHUB_WORKSPACE/.github/materialize_specs.py.gz.b64" | gzip -d > /tmp/materialize_specs.py
          python3 /tmp/materialize_specs.py

      - name: Regenerate and validate registry
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          npm test
          npm run check

      - name: Commit clean specification branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            01-lang/003-native/draft/native-spec.edn \
            01-lang/004-foundation/draft/foundation-spec.edn \
            00-unsorted/platform-language/draft/conformance/native.edn \
            registry-index.json \
            spec-manifest.json
          git commit -m "Specify the logical filesystem boundary and portable std.fs"
          git push --force origin HEAD:refs/heads/agent/std-native-file-contract
