name: Materialize portable exception specifications

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/agent-849-exception-specs.yml

permissions:
  contents: write

jobs:
  materialize-and-validate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact specification branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Verify exact exception-corpus ancestry
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "95878e47b8a5f1f63d8183452b55ecd6310e807b"
          test "$(git rev-parse HEAD^^)" = "d1897525ebab127d0405f69545a29f2718843a5b"

      - name: Materialize the portable exception contract
        shell: bash
        env:
          ERRORS_SECTION_B64: 
          EXCEPTIONS_EDN_B64: 
          L0_INSERT_B64: 
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          def payload(name):
              return base64.b64decode(os.environ[name]).decode()

          spec_path = Path("00-unsorted/platform-language/draft/hal-langspec.edn")
          source = spec_path.read_text()
          start = source.index("  {:section/id :hal/errors")
          end = source.index("\n\n  {:section/id ", start + 1)
          spec_path.write_text(source[:start] + "  " + payload("ERRORS_SECTION_B64") + source[end:])

          exceptions_path = Path("00-unsorted/platform-language/draft/conformance/exceptions.edn")
          exceptions_path.write_text(payload("EXCEPTIONS_EDN_B64"))

          l0_path = Path("00-unsorted/platform-language/draft/conformance/l0.edn")
          l0 = l0_path.read_text()
          marker = "  {:id :error/unmatched-catch"
          if marker not in l0:
              raise SystemExit("structured exception insertion marker changed")
          l0_path.write_text(l0.replace(marker, "  " + payload("L0_INSERT_B64") + "  " + marker, 1))

          native_path = Path("00-unsorted/platform-language/draft/conformance/native.edn")
          native = native_path.read_text()
          native = native.replace(":method-count 366", ":method-count 367", 1)
          old = """  {:name Error
   :availability :implemented
   :methods [new message class]
   :method-classification {:foundation-primitive :all}}"""
          new = """  {:name Error
   :availability :implemented
   :methods [new message class native-type]
   :method-classification
   {:foundation-primitive [new message class]
    :native-only [native-type]}}"""
          if old not in native:
              raise SystemExit("native Error inventory changed")
          native_path.write_text(native.replace(old, new, 1))
          PY

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Validate and regenerate registry indexes
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm test
          npm run registry:generate
          npm run check

      - name: Audit portable expected values
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          l0 = Path("00-unsorted/platform-language/draft/conformance/l0.edn").read_text()
          for forbidden in ["hara.lang.base.Ex$Info", "ExceptionInfo", ":ex/native-type", ":native-type"]:
              if forbidden in l0:
                  raise SystemExit(f"portable L0 corpus contains backend diagnostic {forbidden}")
          exceptions = Path("00-unsorted/platform-language/draft/conformance/exceptions.edn").read_text()
          shared, runtime = exceptions.split("\n :runtime-specific\n", 1)
          for forbidden in ["hara.lang.base.Ex$Info", "ExceptionInfo", ":ex/native-type"]:
              if forbidden in shared:
                  raise SystemExit(f"shared exception corpus contains backend diagnostic {forbidden}")
          if "hara.lang.base.Ex$Info" not in runtime or "ExceptionInfo" not in runtime:
              raise SystemExit("runtime diagnostics are not explicitly specified")
          PY

      - name: Publish validated specification change
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/agent-849-exception-specs.yml
          git config user.name "OpenAI Agent"
          git config user.email "openai-agent@users.noreply.github.com"
          git add -A
          git commit -m "Specify portable semantic exception classes"
          git push --force-with-lease origin HEAD:${{ github.head_ref }}
