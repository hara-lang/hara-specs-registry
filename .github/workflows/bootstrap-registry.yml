name: Bootstrap specifications registry

on:
  pull_request:
    branches: [main]
    paths:
      - "migration/TRIGGER.md"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bootstrap-specifications-registry
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Import the specification history and apply the registry overlay
        env:
          SOURCE_REPOSITORY: hara-lang/hara-specs
          SOURCE_REF: dc269add5de05d06ddf215ca9f1d2d2b0c49f135
        run: bash migration/bootstrap-registry.sh
