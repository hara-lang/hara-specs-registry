name: Agent finalize std.typed dependency contract

on:
  push:
    branches:
      - agent/std-typed-schema-metadata

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out specification branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Apply dependency-boundary contract
        run: python3 .github/scripts/finalize_std_typed_boundary.py

      - name: Regenerate and validate the registry
        shell: bash
        run: |
          npm run build
          npm run check
          npm test

      - name: Commit validated specification update
        shell: bash
        run: |
          rm -f .github/scripts/finalize_std_typed_boundary.py
          rm -f .github/workflows/agent-finalize-std-typed-boundary.yml
          git config user.name "OpenAI Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No specification changes were produced" >&2
            exit 1
          fi
          git commit -m "Require std.typed source-tree independence"
          git push origin HEAD:${GITHUB_REF_NAME}
